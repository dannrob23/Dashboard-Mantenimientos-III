name: Process Excel Data

on:
  push:
    paths:
      - 'data/raw/Bitacora_Final_Dashboard_BAC.xlsx'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Process Excel to JSON
        run: node scripts/processExcel.js

      - name: Copy JSON to public
        run: |
          mkdir -p public/data
          cp data/processed/bitacora.json public/data/bitacora.json

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/bitacora.json data/processed/bitacora.json
          git commit -m "chore: update processed data [skip ci]" || exit 0
          git push
